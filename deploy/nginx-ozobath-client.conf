# ============================================================
# OZOBATH — frontend (static SPA) Nginx server block
# ============================================================
# Target: /etc/nginx/sites-available/ozobath-client
# Enable: ln -s /etc/nginx/sites-available/ozobath-client /etc/nginx/sites-enabled/
# Test:   sudo nginx -t && sudo systemctl reload nginx
#
# Every directive here addresses a measured finding from the live site, not
# boilerplate. Measurements taken against https://ozobath.in on nginx/1.24.0:
#
#   1. CSS and JS were served with NO Content-Encoding at all — 140,831 bytes
#      of CSS and 495,148 bytes of JS shipped raw. Only text/html was gzipped,
#      because the stock `gzip_types` was never widened. This was the single
#      largest cost on the page (~1.5s of render-blocking transfer).
#   2. The site answered over HTTP/1.1, so all assets queued on one connection.
#   3. /llms.txt returned index.html as text/html because the SPA try_files
#      catch-all swallowed it.

# ── HTTP → HTTPS ────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name ozobath.in www.ozobath.in;

    # Leave ACME reachable over plain HTTP so certbot can renew.
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

# ── Canonical host redirect ─────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ozobath.in;

    ssl_certificate     /etc/letsencrypt/live/ozobath.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ozobath.in/privkey.pem;

    return 301 https://ozobath.in$request_uri;
}

# ── Main site ───────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # HTTP/2 multiplexes asset requests over one connection instead of
    # serialising them the way HTTP/1.1 does. On nginx >= 1.25.1 this replaces
    # the old `listen ... http2` form; for older builds append `http2` to the
    # listen directives above instead.
    http2 on;

    server_name ozobath.in;
    root /var/www/ozobath/client;   # <-- adjust to your dist/ path
    index index.html;

    # ── TLS ─────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/ozobath.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ozobath.in/privkey.pem;

    # TLS 1.3 completes the handshake in one round trip instead of two, and
    # was flagged as missing. Keeping 1.2 alongside preserves older clients.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Compression ─────────────────────────────────────────
    # THE key fix. Stock nginx gzips only text/html, which is why the CSS and
    # JS bundles were transferred uncompressed. Text assets compress ~85%:
    # the 141 KB stylesheet drops to roughly 18 KB on the wire.
    gzip              on;
    gzip_vary         on;          # keeps proxies/CDNs from serving the wrong variant
    gzip_comp_level   6;           # past ~6 the CPU cost outweighs the byte savings
    gzip_min_length   256;         # below this the gzip header exceeds the saving
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/markdown
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    # Brotli beats gzip by a further ~15% on text. Uncomment if the server has
    # ngx_brotli built in (Hostinger's stock nginx usually does not).
    # brotli            on;
    # brotli_comp_level 5;
    # brotli_types      text/plain text/css application/javascript application/json image/svg+xml;

    # ── Machine-readable files ──────────────────────────────
    # These MUST be matched before the SPA catch-all below, or try_files falls
    # through to index.html and serves HTML under a .txt/.xml URL.
    location = /llms.txt {
        default_type text/markdown;
        charset      utf-8;
        add_header   Cache-Control "public, max-age=3600";
    }

    location = /robots.txt {
        default_type text/plain;
        add_header   Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header   Cache-Control "public, max-age=3600";
    }

    # ── Static assets ───────────────────────────────────────
    # Vite fingerprints these filenames, so the content behind a given URL can
    # never change: cache them permanently.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Images are named, not hashed, so they need revalidation eventually.
    location /images/ {
        access_log off;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri =404;
    }

    location ~* \.(woff2?|ttf|otf|eot)$ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── SPA routes ──────────────────────────────────────────
    # index.html itself must never be cached, or clients keep loading an old
    # document that references deleted hashed assets after a deploy.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
