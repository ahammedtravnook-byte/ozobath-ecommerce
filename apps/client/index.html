<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── Icons ──────────────────────────────────────────────
       Generated from public/logo/ozobath.png by `npm run icons`.
       Order matters: browsers take the LAST supported <link rel="icon">,
       so the SVG sits after the PNGs for modern engines, while favicon.ico
       at the site root is what older crawlers probe for by default. -->
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#0f3d6b" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- ── Primary meta ────────────────────────────────────── -->
  <title>OzoBath - Premium Shower Enclosures &amp; Bathroom Fittings in India</title>
  <meta name="description"
    content="Shop premium shower enclosures, glass partitions, shower panels and designer bathroom fittings from OzoBath. Toughened glass, corrosion-resistant hardware and nationwide installation across India." />
  <meta name="keywords"
    content="shower enclosure, shower cubicle, glass shower partition, bathroom fittings, shower panel, bathroom accessories, OzoBath, premium bathroomware India" />
  <meta name="author" content="OzoBath" />
  <meta name="theme-color" content="#0f3d6b" />
  <meta name="application-name" content="OzoBath" />
  <meta name="apple-mobile-web-app-title" content="OzoBath" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Explicitly invite indexing. max-image-preview:large is what allows Google
       to show a large thumbnail instead of a bare text result. -->
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
  <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

  <link rel="canonical" href="https://ozobath.in/" />

  <!-- ── Open Graph (WhatsApp, Facebook, LinkedIn) ────────── -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="OzoBath" />
  <meta property="og:title" content="OzoBath - Premium Shower Enclosures &amp; Bathroom Fittings" />
  <meta property="og:description"
    content="Premium shower enclosures, glass partitions and designer bathroom fittings. Toughened glass, corrosion-resistant hardware, nationwide installation across India." />
  <meta property="og:url" content="https://ozobath.in/" />
  <meta property="og:image" content="https://ozobath.in/og-image.png" />
  <meta property="og:image:secure_url" content="https://ozobath.in/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="OzoBath - Bathrooms You Crave" />
  <meta property="og:locale" content="en_IN" />

  <!-- ── Twitter / X ──────────────────────────────────────── -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="OzoBath - Premium Shower Enclosures &amp; Bathroom Fittings" />
  <meta name="twitter:description"
    content="Premium shower enclosures, glass partitions and designer bathroom fittings. Toughened glass and nationwide installation across India." />
  <meta name="twitter:image" content="https://ozobath.in/og-image.png" />
  <meta name="twitter:image:alt" content="OzoBath - Bathrooms You Crave" />

  <!-- ── Structured data ──────────────────────────────────────
       The Organization block is what lets Google associate a logo with the
       domain, which is the prerequisite for showing an icon beside the result.
       WebSite + SearchAction enables the sitelinks search box. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://ozobath.in/#organization",
          "name": "OzoBath",
          "alternateName": "OzoBath - Bathrooms You Crave",
          "url": "https://ozobath.in/",
          "logo": {
            "@type": "ImageObject",
            "@id": "https://ozobath.in/#logo",
            "url": "https://ozobath.in/favicon-512x512.png",
            "contentUrl": "https://ozobath.in/favicon-512x512.png",
            "width": 512,
            "height": 512,
            "caption": "OzoBath"
          },
          "image": { "@id": "https://ozobath.in/#logo" },
          "description": "OzoBath manufactures and retails premium shower enclosures, glass partitions and designer bathroom fittings across India.",
          "slogan": "Bathrooms You Crave",
          "address": {
            "@type": "PostalAddress",
            "addressCountry": "IN"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://ozobath.in/#website",
          "url": "https://ozobath.in/",
          "name": "OzoBath",
          "description": "Premium shower enclosures and bathroom fittings for Indian homes.",
          "publisher": { "@id": "https://ozobath.in/#organization" },
          "inLanguage": "en-IN",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://ozobath.in/shop?search={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
  </script>

  <!-- ── LCP preload ──────────────────────────────────────────
       The hero image is the LCP element. Preloading it here means the
       request starts from the raw HTML, before the JS bundle has parsed
       and before React mounts, rather than after CSS/JS discovery. -->
  <link rel="preload" as="image" href="/images/hero_bathroom.webp" fetchpriority="high" />

  <!-- ── Google Fonts: Inter + Outfit ──────────────────────────
       The stylesheet was previously render-blocking: the browser could
       not paint until it had fetched fonts.googleapis.com over a fresh
       connection. Loading it with media="print" + onload flips it to
       non-blocking, so text paints immediately in the fallback face and
       swaps when the webfont lands.

       The weight axes are also narrowed. The full variable ranges
       (100..900 across two axes, plus italics, plus Playfair) shipped far
       more font data than the design uses. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:wght@400;700&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:wght@400;700&display=swap"
      rel="stylesheet" />
  </noscript>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
